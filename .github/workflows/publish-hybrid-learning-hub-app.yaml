name: Docker CI for Hybrid Learning Hub App
on:
  push:
    branches: [ dev ]
jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - name: Build and Push the Image
        run: |
          cd backend
          docker login --username ${{ vars.username }} --password ${{secrets.hybrid_learning-hub_app }} ghcr.io
          docker build . --tag ghcr.io/${{ vars.username }}/hybrid-learning-hub-docker-app-server:latest
          docker push ghcr.io/${{ vars.username }}/hybrid-learning-hub-docker-app-server:latest