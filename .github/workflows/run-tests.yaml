name: Run Test

on:
  workflow_call
#    outputs:
#      docker_tag:
#        description: "Docker Image Tag"
#        value: ${{ jobs.build_docker.outputs.docker_tag }}

jobs:
  build_docker:
    name: Build Docker Image for Tests
    uses: ./.github/workflows/build-docker.yaml
    secrets: inherit

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build_docker
    container:
      image: ${{ needs.build_docker.outputs.docker_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.HYBRID_LEARNING_HUB_REGISTRY_PAT }}
    defaults:
      run:
        working-directory: /backend
    services:
      postgres:
        image: postgres:14
        options: >-
          --health-cmd "pg_isready"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres_db
        ports:
          - 5432:5432

    steps:
      - name: Container Information & Run Pytest
        run: |
          echo "Running in image: ${{ needs.build_docker.outputs.docker_tag }}"
          echo "Working directory: $(pwd)"
          ls -la

      - name: Configure Database Connection
        run: |
          echo "Setting up database connection for tests"
          # Add any necessary environment variables for test database connection
          export DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres_db:5432/postgres
          echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

      - name: Run Pytest
        run: |
          echo "Running tests with coverage"
          pytest -v /backend/tests --cov=app/ --cov-report term-missing --cov-report xml --durations=28

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: /backend/coverage.xml
          if-no-files-found: warn

      - name: Debug on Failure
        if: failure()
        run: |
          echo "Tests failed, collecting debug information"
          echo "===== Environment Variables ====="
          env | sort
          echo "===== Application Directory Content ====="
          ls -la /backend
          echo "===== Log Files ====="
          find /backend -name "*.log" -exec cat {} \; || echo "No log files found"
