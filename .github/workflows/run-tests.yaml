jobs:
  build_docker:
    name: Build Docker Image for Tests
    uses: ./.github/workflows/build-docker.yaml
    secrets: inherit

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build_docker
    container:
      image: ${{ needs.build_docker.outputs.docker_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.HYBRID_LEARNING_HUB_REGISTRY_PAT }}
      defaults:
        run:
          working-directory: /backend
