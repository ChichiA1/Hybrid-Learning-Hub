name: Run Test

on:
  workflow_call
#    outputs:
#      docker_tag:
#        description: "Docker Image Tag"
#        value: ${{ jobs.build_docker.outputs.docker_tag }}

jobs:
  build_docker:
    name: Build Docker Image for Tests
    uses: ./.github/workflows/build-docker.yaml
    secrets: inherit

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build_docker
    container:
      image: ${{ needs.build_docker.outputs.docker_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.HYBRID_LEARNING_HUB_REGISTRY_PAT }}

    services:
      postgres:
        image: postgres:14
        options: >-
          --health-cmd "pg_isready"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
        env:
          POSTGRES_PASSWORD: postgres

    steps:
      - name: Run Pytest
        run: |
          echo "Running in container: ${{ needs.build_docker.outputs.docker_tag }}"
          echo "===== Directory Structure ====="
          find / -type d -maxdepth 3 -not -path "*/proc/*" -not -path "*/sys/*" -not -path "*/dev/*" | sort
          
          echo "===== Application Directory Content ====="
          # Adjust these paths based on where your application is installed in the container
          ls -la /app/ || echo "No /app directory"
          ls -la /usr/src/ || echo "No /usr/src directory"
          
          echo "===== Environment Variables ====="
          env | sort
          
          echo "===== Container OS Info ====="
          cat /etc/os-release
          
          pytest -v tests/ --cov=app/ --cov-report term-missing --durations=28
