name: Run Test

on:
  workflow_call:
    outputs:
      docker_tag:
        description: "Docker Tag"
        value: ${{ jobs.build_docker.outputs.docker_tag }}

jobs:
  build_docker:
    name: Build Docker Image for Tests
    uses: ./.github/workflows/build-docker.yaml
    secrets: inherit

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build_docker

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Decode Docker Tag
          id: decode_tag
          uses: cloudposse/github-action-secret-outputs@main
          with:
            secret: ${{ secrets.PASSWORD }}
            op: decode
            in: ${{ needs.build_docker.outputs.docker_tag }}

            - name: Retrieve Docker Tag from Previous Job
              run: |
                echo "HERE IS THE DOCKER TAG: ${{ steps.decode_tag.outputs.out }}"

            - name: Pull and Run Docker Image
              run: |
                DOCKER_TAG="${{ steps.decode_tag.outputs.out }}"
                echo "Pulling Docker Image: $DOCKER_TAG"
                docker pull $DOCKER_TAG
                docker run -d --name test_container $DOCKER_TAG

      services:
        postgres:
          image: postgis/postgis:13-3.1
          options: >-
            --health-cmd "pg_isready"
            --health-interval 1s
            --health-timeout 3s
            --health-retries 30
          env:
            POSTGRES_PASSWORD: postgres

        redis:
          image: redis:5.0-buster