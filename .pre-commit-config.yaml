repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8  # This uses the installed version of flake8
        language: system  # Uses the system-installed Python environment
        files: \.(py)$  # Limit to Python files

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy  # This uses the installed version of mypy
        language: system  # Uses the system-installed Python environment
        files: \.(py)$  # Limit to Python files